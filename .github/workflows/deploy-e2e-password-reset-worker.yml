name: Deploy E2E password reset Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/password-reset-api/**
      - .github/workflows/deploy-e2e-password-reset-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Set the CLOUDFLARE_API_TOKEN Actions secret before deploying this Worker."

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy --config workers/password-reset-api/wrangler.jsonc
